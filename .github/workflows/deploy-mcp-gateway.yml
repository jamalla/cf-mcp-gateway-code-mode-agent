name: Deploy MCP Gateway to Cloudflare Workers

# Runs when an admin merges a registration PR (registry/**) or when gateway code changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "scripts/mcp-registry/**"
      - "apps/mcp-gateway/**"
      - "pnpm-lock.yaml"

concurrency:
  group: deploy-mcp-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate registry & type-check
        run: pnpm --filter @apps/mcp-gateway run check

      - name: Deploy gateway
        run: pnpm --filter @apps/mcp-gateway run deploy

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS https://cf-mcp-gateway.to-jamz.workers.dev/servers | tee /dev/stderr | jq -e '.ok == true' > /dev/null
